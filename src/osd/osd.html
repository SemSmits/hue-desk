<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
    .osd {
      margin: 8px; padding: 12px 16px; border-radius: 14px;
      background: rgba(20, 22, 28, 0.92); color: #f2f2f2;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      opacity: 0; transform: translateY(6px); transition: opacity .15s, transform .15s;
    }
    .osd.show { opacity: 1; transform: none; }
    .osd.error .value { color: #ff7a7a; }
    .title { font-size: 12px; color: #9aa0aa; text-transform: uppercase; letter-spacing: .06em; }
    .value { font-size: 17px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); margin-top: 8px; display: none; }
    .bar > div { height: 100%; border-radius: 2px; background: #ffc857; transition: width .15s; }
  </style>
</head>
<body>
  <div class="osd" id="osd">
    <div class="title" id="title"></div>
    <div class="value" id="value"></div>
    <div class="bar" id="bar"><div id="fill"></div></div>
  </div>
  <script>
    const osd = document.getElementById('osd');
    window.hue.on('osd', (p) => {
      document.getElementById('title').textContent = p.title || '';
      document.getElementById('value').textContent = p.value || '';
      osd.classList.toggle('error', Boolean(p.error));
      const bar = document.getElementById('bar');
      bar.style.display = typeof p.percent === 'number' ? 'block' : 'none';
      if (typeof p.percent === 'number') document.getElementById('fill').style.width = p.percent + '%';
      osd.classList.remove('show');
      requestAnimationFrame(() => osd.classList.add('show'));
    });
  </script>
</body>
</html>
